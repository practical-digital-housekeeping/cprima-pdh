# Workspace root of the cprima-pdh monorepo (not published). The published package is packages/cprima-pdh;
# packages/pdh-testkit is test support only and is never published.
[tool.uv.workspace]
members = ["packages/*"]

[dependency-groups]
dev = ["pytest>=8", "pdh-testkit"]

[tool.uv.sources]
pdh-testkit = { workspace = true }

[tool.pytest.ini_options]
testpaths = ["packages/cprima-pdh/tests", "packages/pdh-testkit/tests"]
addopts = "-m 'not slow and not client'"
markers = [
    "slow: opens genuine vaults with their real key derivation (minutes); run with `just test-genuine`",
    "client: asks a real client (keepassxc-cli) to read what pdh wrote; run with `just test-client`",
]
