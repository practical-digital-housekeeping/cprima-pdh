# Workspace root of the cprima-pdh monorepo (not published). The published package is packages/cprima-pdh;
# packages/pdh-testkit is test support only and is never published.
[tool.uv.workspace]
members = ["packages/*"]

[dependency-groups]
dev = ["pytest>=8", "pytest-xdist>=3", "pdh-testkit"]

[tool.uv.sources]
pdh-testkit = { workspace = true }

[tool.pytest.ini_options]
testpaths = ["packages/cprima-pdh/tests", "packages/pdh-testkit/tests"]
addopts = "-m 'not compatibility and not interoperability' --strict-markers --durations=10"
markers = [
    "compatibility: the same behaviour across every genuine template (all KDBX versions, ciphers, key derivations; about an hour); run with `just test-compatibility`",
    "interoperability: an independent program (keepassxc-cli, sops, age) reads or checks what pdh wrote; run with `just test-interoperability`",
]
