# =================================================================================================
# FACETS (reusable bundles)
# =================================================================================================

[facet.login]
description = "Account at a website: needs a URL, https preferred"
required = ["Title", "UserName", "Password", "URL"]
https_only = true

[facet.contact]
description = "Postal and phone contact data"
optional = ["address", "phone"]

# The identifiers of a piece of hardware. Reused by every device-like record type.
[facet.device-core]
description = "A piece of hardware: its identifiers"
optional = ["serial_number", "MAC"]

# The admin interface of a device: where it is (URL, often a local http:// page, which is a valid URI) and the
# account that opens it. Recommended, not required: a fresh device may have no password yet.
[facet.admin-login]
description = "Admin login of a device: the web interface and its account"
recommended = ["URL", "UserName", "Password"]

# SSH access to a device: the private key it accepts. A password login uses the standard Password field.
# The key is protected by the vocabulary (`key_material`); a public key or fingerprint is not secret.
[facet.ssh-access]
description = "SSH access to a device: the private key"
optional = ["ssh_key"]

# A Wi-Fi network: its name is required, its key is recommended (a network can be open).
[facet.wifi-network]
description = "A Wi-Fi network: its name and key"
required = ["SSID"]
recommended = ["wifi_key"]

# What every physical card has. A card also has a validity: the entry's own expiry date (a missing
# one is reported at WARN level). `closed` makes a field that a card type does not allow visible:
# a CVV on a bank card is such a mismatch.
[facet.card-core]
description = "Physical card: number, PIN, issuer, and a validity (the entry's expiry date)"
required = ["Title"]
optional = ["card_number", "PIN", "cardholder", "issuer", "issuer_phone"]
expires = true
closed = true

# =================================================================================================
# RECORD TYPES (schemas)
# =================================================================================================

# An account at a website: an entry with a URL.
[schema.website]
area = "Online & Communication"
description = "Account at a website"
family = "access"
facets = ["login"]

# An online shop is a website account with optional customer data: name both, `onlineshop, website`.
[schema.onlineshop]
area = "Shopping"
description = "Online shop login"
family = "access"
facets = ["login", "contact"]
optional = ["customer_no", "license_key"]

# Two kinds of payment card; they differ in one field. A credit card may carry a CVV (allowed, not
# required); a bank card (debit, Girocard) has none, so a CVV on it is reported as an unknown field.
[schema.credit-card]
area = "Money"
description = "Credit card: a card core plus an optional CVV"
family = "finance"
facets = ["card-core"]
optional = ["CVV"]

[schema.bank-card]
area = "Money"
description = "Bank card (debit, Girocard): a card core, no CVV"
family = "finance"
facets = ["card-core"]

# A key pair or key: SSH, GPG, signing keys. The private part is protected by the vocabulary
# (`key_material`: any field named like `ssh_key`, `private_key`, `armored`); public
# keys and fingerprints are deliberately not. Not closed: key entries vary a lot.
[schema.keypair]
area = "Tech"
description = "Public/private key (SSH, GPG, ...)"
family = "keys"
required = ["Title"]
optional = ["fingerprint"]

# A Wi-Fi access point, or a router with Wi-Fi: a device plus a Wi-Fi network. The admin login uses the
# standard URL/UserName/Password fields; a local `http://` admin page is a valid URI and is not flagged
# here. Not closed: devices carry all kinds of extra notes (port forwarding, firmware, ...).
[schema.wifi-access-point]
area = "Home & Utilities"
description = "Wi-Fi access point or router with Wi-Fi"
family = "device"
required = ["Title"]
facets = ["device-core", "wifi-network", "admin-login"]

# A device running OpenWrt, or a vendor fork of it (GL.iNet, RUTOS): the `root` account opens both the web
# interface (LuCI) and SSH, by password (the standard fields) or by key. Name it together with the device
# type: `_schema = wifi-access-point, openwrt-device`. pdh never checks that the user name is `root`.
[schema.openwrt-device]
area = "Home & Utilities"
description = "OpenWrt device: root login over the web interface and SSH"
family = "device"
required = ["Title"]
facets = ["device-core", "admin-login", "ssh-access"]

# An additional login on a device. The device entry keeps its main login in the standard fields; every other
# user gets an entry of this type with the standard fields and a link to the device. The link must resolve and
# must point at an entry that has one of the device schemas.
[schema.device-account]
area = "Home & Utilities"
description = "An additional login on a device, linked to the device entry"
family = "access"
required = ["Title", "UserName", "Password", "device"]
optional = ["URL"]

[schema.device-account.links]
device = ["wifi-access-point", "openwrt-device"]

[schema.sim-card]
area = "Home & Utilities"
description = "SIM card"
family = "telecom"
required = ["Title", "phone", "PIN", "PUK"]
optional = ["ICCID", "carrier", "contract_no"]
closed = true

# --- more record types ---------------------------------------------------------------------------

[schema.bank-account]
area = "Money"
description = "Bank or broker account"
family = "finance"
facets = ["login"]
required = ["IBAN"]
optional = ["BIC", "account_number"]

[schema.utility-contract]
area = "Home & Utilities"
description = "Customer account with a utility or service provider"
family = "contract"
required = ["Title", "customer_no"]
optional = ["contract_no", "phone", "email"]

[schema.hardware]
area = "Home & Utilities"
description = "A piece of hardware with its identifiers"
family = "device"
required = ["Title"]
optional = ["serial_number", "part_number", "MAC", "IMEI"]

[schema.hsm]
area = "Home & Utilities"
description = "Hardware security module with its PINs"
family = "device"
required = ["Title"]
optional = ["serial_number", "so_pin", "user_pin"]

[schema.identity-document]
area = "Identity & Authorities"
description = "ID card, passport, certificate and similar"
family = "identity"
required = ["Title"]
optional = ["valid_until", "PIN"]

[schema.membership]
area = "Leisure & Interests"
description = "Membership or reward programme"
family = "identity"
required = ["Title", "member_no"]
optional = ["valid_until"]

[schema.software-license]
area = "Tech"
description = "Software licence"
family = "keys"
required = ["Title", "license_key"]
optional = ["serial_number"]

[schema.api-credential]
area = "Tech"
description = "API or OAuth credential"
family = "keys"
required = ["Title"]
optional = ["api_key", "api_secret", "client_id", "client_secret"]

# =================================================================================================
# FIELD-BASED MATCHING (types that follow from the fields an entry has, with or without `_schema`)
# =================================================================================================
#
# A rule lists fields an entry must ALL have (non-empty); the entry is then of that record type. Only fields
# that belong to one record type alone are used, so a rule never guesses: types that look alike (bank-card or
# credit-card, a plain website, a shop, a software licence, a key that may also open a router) are named with
# `_schema`. A CVV, for example, is deliberately NOT a rule: a bank card is `closed` so that a CVV on it is reported
# as a mismatch, which a rule binding `credit-card` would silently turn into a second type.
# A test checks that these rules fire for their own type and for no other.

[[match]]
schema = "bank-account"
has = ["IBAN"]

[[match]]
schema = "sim-card"
has = ["PUK"]

[[match]]
schema = "hsm"
has = ["so_pin"]

[[match]]
schema = "wifi-access-point"
has = ["SSID"]

[[match]]
schema = "api-credential"
has = ["api_key"]

[[match]]
schema = "api-credential"
has = ["client_id"]

[[match]]
schema = "membership"
has = ["member_no"]

[[match]]
schema = "utility-contract"
has = ["customer_no", "contract_no"]

[[match]]
schema = "device-account"
has = ["device"]

[[match]]
schema = "keypair"
has = ["fingerprint"]
