# Practical Digital Housekeeping, profile `pdh-default` (taxonomy `pdh`, profile `default`): schemas, field
# vocabulary and taxonomy (single source of truth).
# Licensed under CC-BY-4.0. The taxonomy is dogma: field names outside the vocabulary are unsupported (WARN).
# A profile is one complete variant of a taxonomy (method/taxonomy/profiles/<taxonomy>-<name>.toml); a vault follows
# exactly one. Profiles are never merged or layered.
#
#   `pdh method show`      prints the taxonomy document generated from this file (`just taxonomy` refreshes <name>.md)
#   `pdh method schemas`   prints the compiled rules and the vocabulary
#   `pdh method profiles`  lists the packaged profiles
#   `pdh check validate`   reports violations (`--summary` for counts); `pdh check` lists conform / nonconform entries
#
# --- how entries are typed -------------------------------------------------------------------
# An entry names its schemas in a custom field `_schema`, comma-separated, e.g.
#     _schema = onlineshop, website
# Every named schema applies (union). Unknown names are reported; no `_schema` = unclassified.
# Folders play no role in typing. Set it with:  pdh edit set "group/path/title" _schema "website" --apply
#
# --- sections ---------------------------------------------------------------------------------
# Rules (they validate entries):
#   [field.NAME]   vocabulary term: a canonical field name, checked on EVERY entry
#   [facet.NAME]   reusable bundle of field rules
#   [schema.NAME]  a record type; mixes in facets with `facets = [...]`
# Taxonomy (documentation, rendered by `pdh method show`):
#   [taxonomy]     title, purpose, principles, naming_rules, binding_rules
#   [[axis]] [area.NAME] [family.NAME] [kind.NAME] [[decision]] [[source]]
#
# `status = "proposed"` (engine feature) on a [field.*] or [schema.*] documents it in the taxonomy but it is
# IGNORED by every check. This profile has none: everything it documents is enforced.
#
# field keys:   kind (see [kind.*]), family (list), status, description,
#               aliases (engine feature; the public taxonomy defines none: non-canonical names are WARN),
#               match (regex searched in the field NAME, for families like pins/tokens),
#               protected (true = must be protected, false = must NOT be, unset = unchecked),
#               pattern (regex the whole value must match; applies to NAME and aliases)
# schema/facet keys:  family (schema only), status, description, facets,
#               required (MUST: missing = ERROR), recommended (SHOULD: missing = WARN), optional (MAY),
#               protected, https_only (WARN), expires (WARN), closed (WARN), aliases, types (field -> [field.*] type),
#               links (link field -> the schemas its target may have; the field is a term of kind `link`)
# Finding levels (log levels): ERROR = broken structure, WARN = hygiene, INFO = format hints (`pattern`).

# =================================================================================================
# TAXONOMY
# =================================================================================================

[profile]
taxonomy = "pdh"
name = "default"
version = "0.1"
description = "The opinionated default: one complete taxonomy for a person's digital life, starting with the password vault."

# --- finding levels and standard fields: parameters of the checks (a complete profile states both) ---------------

# Severity of a finding, like log levels: an exact rule id wins over its kind (the part before the colon), which
# wins over `default`. `required` (MUST) is an ERROR, `recommended` (SHOULD) a WARN, `optional` (MAY) no finding.
# `http://` is a valid URI, so `url:https` is only ever a WARN.
[level]
default = "WARN"
required = "ERROR"
pattern = "INFO"
"schema:unknown" = "ERROR"
"link:invalid" = "ERROR"
"link:dangling" = "ERROR"
"link:self" = "ERROR"
"link:target-unclassified" = "INFO"
"known-password" = "ERROR"
"breach:unchanged" = "ERROR"
"breach:changed" = "INFO"
"breach:other" = "INFO"
"breach:account" = "WARN"

# Standard fields: what every entry has, and of what kind. The names are the profile's; how a store keeps them
# (a KeePass attribute, a Bitwarden field, ...) is the backend's business.
[standard.Title]
kind = "text"
description = "The entry's title."

[standard.UserName]
example = "user"
kind = "text"
description = "The user name of a login."

[standard.Password]
example = "example-password"
kind = "secret"
generate = true
description = "The password of a login."

[standard.URL]
kind = "url"
description = "The web address of a login."

[standard.Notes]
kind = "text"
description = "Free-form notes."

[standard.otp]
kind = "otp"
description = "The one-time-password secret (TOTP/HOTP) of an entry."

# --- binding: how an entry names its record types ----------------------------------------------------------------
# A custom field that holds one or more record type names, comma-separated. It is never an unknown field.
[binding]
field = "_schema"

# --- advice: what to do about a finding (read by `pdh check conform`) ------------------------------------------
# The most specific key wins: an exact rule id, then its kind, then `default`; a finding about a vocabulary term
# itself prefers the `@vocabulary` variant. `automatable` = an agent may run the command without asking the owner.
# Command templates: {entry} quoted entry path, {term} the term of the rule id, {field} each field the finding names
# (repeated per field, joined by " ; "). Without a `note`, the finding's own message is the note.
[advice.default]
action = "review"

[advice.required]
action = "supply-value"
command = "pdh edit set {entry} {term} <value> --apply"
note = "ask the owner for the value; never invent one"

[advice.recommended]
action = "supply-value"
command = "pdh edit set {entry} {term} <value> --apply"
note = "ask the owner for the value; never invent one"

[advice.alias]
action = "rename-field"
automatable = true
command = "pdh edit rename-field {entry} {field} {term} --apply"
note = "same concept, old spelling: rename to {term}"

[advice.protected]
action = "protect-field"
note = "toggle protection in the client, or re-enter the value with `set ... - --overwrite --protect`"

[advice."protected@vocabulary"]
action = "protect-field"
automatable = true
command = "pdh edit vocabulary --apply"

[advice.unprotected]
action = "unprotect-field"
note = "toggle protection in the client, or re-enter the value with `set ... - --overwrite --protect`"

[advice."unprotected@vocabulary"]
action = "unprotect-field"
automatable = true
command = "pdh edit vocabulary --apply"

[advice."closed:unknown-field"]
action = "decide-field"
note = "rename each field to a vocabulary term (pdh edit rename-field), or remove it in the client"

[advice.unknown-field]
action = "decide-field"
note = "rename each field to a vocabulary term (pdh edit rename-field), or remove it in the client"

[advice."url:https"]
action = "review-url"
note = "http:// is a valid URI; change it only if the site really offers https"

[advice.expires]
action = "set-expiry"
note = "set the expiry date in the client; pdh does not write it"

[advice."schema:unknown"]
action = "fix-schema"
command = "pdh edit set {entry} {binding} <schema> --overwrite --apply"
note = "name a schema from `pdh method schemas`, or drop the field"

[advice.link]
action = "fix-link"
command = "pdh edit link {entry} <target> --overwrite --apply"
note = "point the link field at an entry with an allowed schema"

[advice.known-password]
action = "change-password"
command = "pdh edit set {entry} Password - --overwrite --apply"
note = "this password appears in known leaks: change it at the service, then store the new one (the value is prompted, never passed on the command line)"

[advice."breach:unchanged"]
action = "change-password"
command = "pdh edit set {entry} Password - --overwrite --apply"
note = "the site was breached and passwords were leaked; this entry has not been changed since: change the password at the service"

[advice."breach:changed"]
action = "review-breach"
note = "the site was breached, but this entry was changed afterwards"

[advice."breach:other"]
action = "review-breach"
note = "the site was breached; no passwords were leaked, but check what was (data classes in the report)"

[advice."breach:account"]
action = "review-breach"
note = "the e-mail address of this entry appears in known breaches (names in the report): check those services"

[advice.pattern]
action = "review-value"
note = "format hint only; the owner is responsible for the value"

[taxonomy]
title = "Taxonomy of schemas and fields"
purpose = """
KeePass entries are untyped bags of fields, and KeePassDX has no typed fields. Practical Digital
Housekeeping emulates the typing that 1Password offers (field types and item categories) with explicit
`_schema` fields and a controlled field vocabulary. This document describes that model for the profile
`pdh-default`. It is generated from the profile file, so it cannot contradict the rules that `pdh` applies.
"""
principles = [
    "A record has exactly one owner (top-level group) and one area (sub-group), but one or more record types: `_schema` may name several schemas.",
    "Multiple rules are the norm. A record type is composed from facets, an entry may carry several schemas, and the field vocabulary applies on top. Requirements are the union, so a rule is written once and never repeated.",
    "Typing is explicit on the entry (`_schema`) and/or follows from the fields it has (match rules), never from folder names or tags. The types of an entry are the union of both.",
    "The taxonomy is dogma: one concept, one canonical term. A field name outside the vocabulary is unsupported and reported as a WARN.",
    "Protection follows the kind of a field: secrets, keys and card numbers must be protected.",
    "pdh reports findings and never blocks editing. KeePass stays the source of truth.",
    "No secret value is ever printed by pdh.",
    "Entries may relate to each other through a link field (a UUID). pdh checks that a link resolves and points at an allowed record type, never what it says.",
    "pdh checks structure and hygiene: which fields exist, their names, their protection, whether an expiry date is set. It does not judge whether a value is correct (no checksums, no lookups); data quality is the owner's responsibility.",
    "Folders are for browsing; day-to-day finding is done by search.",
]
naming_rules = [
    "Field labels contain no spaces.",
    "Terms are snake_case: lowercase words joined by `_` (`customer_no`, `serial_number`, `api_key`, `so_pin`).",
    "A term that is itself an abbreviation is written in capitals (PIN, PUK, CVV, IBAN, BIC, ICCID, IMEI, MAC, SSID); inside a compound the abbreviation is lowercase (`so_pin`, `wifi_key`).",
    "Schema names are kebab-case, singular, named after the record type and never after a folder.",
    "Only canonical terms are supported; other spellings (case, language, spacing) are renamed to the term. `mobile` and `phone` are two different terms.",
    "A field name that is not in the vocabulary is unsupported (WARN): rename it to a term, or remove it.",
    "Area names are Title Case, one to three words.",
]
binding_rules = [
    "An entry names its schemas in the custom field `_schema`, comma-separated, and/or has fields that a match rule binds to a record type (a rule lists the fields an entry must all have, non-empty).",
    "Every named or bound schema applies; the requirements are the union. A schema that is both named and matched counts once, as named.",
    "`closed` is checked against the union of all applied schemas.",
    "An unknown schema name is reported (`schema:unknown`); names are case-sensitive.",
    "No `_schema` and no matching rule means unclassified: only the field vocabulary applies.",
    "A match rule only binds fields that belong to one record type alone; ambiguous types (a bank card or a credit card, a website) are named with `_schema`.",
    "Facets are internal building blocks; `_schema` accepts schema names only.",
]

[[axis]]
name = "Owner"
meaning = "Whose record it is"
where = "Top-level group, one per person, plus one for shared records"
status = "decided"

[[axis]]
name = "Area"
meaning = "Which part of life it belongs to"
where = "Sub-group below the owner"
status = "implemented"

[[axis]]
name = "Record type"
meaning = "What kind(s) of record it is; one or more per entry"
where = "`_schema` custom field with one or more schema names, emulating 1Password item categories"
status = "implemented"

[[axis]]
name = "Sensitivity"
meaning = "How bad a leak would be"
where = "Tags (for example FinancialRisk, IdentityTheft, SecurityCritical, PrivacySensitive); never used for binding"
status = "open"

# --- areas (starter set: 11 life areas, one sub-group each below an owner) -----------------------

[area."Work"]
description = "Professional accounts: employer and client systems, business SaaS, work-related services."

[area."Tech"]
description = "Technical accounts and material: development, cloud, keys, licences, AI, RPA, device vendors."

[area."Shopping"]
description = "Shops, marketplaces and parcel services."

[area."Leisure & Interests"]
description = "Creative software and media, sport, forums, culture and hobbies."

[area."Online & Communication"]
description = "Social networks, e-mail, messaging, domains and hosting."

[area."Home & Utilities"]
description = "Telecom, energy, housing, home network and devices."

[area."Money"]
description = "Banks, brokers, insurance and payment accounts."

[area."Learning"]
description = "Courses, certifications and standards bodies."

[area."Identity & Authorities"]
description = "Public bodies, tax and identity documents."

[area."Travel & Mobility"]
description = "Travel, transport and vehicles."

[area."Health"]
description = "Health insurance, doctors and pharmacy."

# --- families (groups of record types) ----------------------------------------------------------

[family.access]
description = "Accounts you log in to: websites, shops, e-mail, servers, APIs."

[family.finance]
description = "Money: payment cards, bank and broker accounts."

[family.identity]
description = "Who you are to others: ID documents, memberships, reward programmes."

[family.telecom]
description = "Mobile and fixed-line subscriptions and SIM cards."

[family.contract]
description = "Customer relationships with utilities and service providers."

[family.device]
description = "Hardware and its identifiers: routers, phones, HSMs, serial numbers."

[family.keys]
description = "Cryptographic keys, licenses and recovery material."

# --- kinds (what a field is; modelled on 1Password field types) ---------------------------------

[kind.text]
example = "example"
description = "Free text."
onepassword = "STRING"

[kind.secret]
example = "example-secret"
description = "A secret the owner must not shoulder-surf: PIN, PUK, password, token, recovery code."
onepassword = "CONCEALED"
default_protected = true

[kind.key]
example = "example-key"
description = "Private key material (SSH, GPG, signing keys, seeds)."
onepassword = "SSHKEY"
default_protected = true

[kind.identifier]
example = "ID-0001"
description = "A number or ID that is not secret: customer number, serial number, ICCID, MAC."
onepassword = "STRING"
default_protected = false

[kind.card]
example = "0000"
description = "A payment card number or security code."
onepassword = "CREDIT_CARD_NUMBER"
default_protected = true

[kind.phone]
example = "+49 30 1234567"
description = "A phone number."
onepassword = "PHONE"
default_protected = false

[kind.email]
example = "user@example.org"
description = "An e-mail address."
onepassword = "EMAIL"
default_protected = false

[kind.address]
example = "Example Street 1\n00000 Example City"
description = "A postal address."
onepassword = "ADDRESS"
default_protected = false

[kind.url]
example = "https://example.org/"
description = "A web address."
default_protected = false

[kind.date]
example = "2030-01-01"
description = "A calendar date, such as a validity end."
onepassword = "DATE"
default_protected = false

[kind.otp]
example = "JBSWY3DPEHPK3PXP"
description = "A one-time-password secret (TOTP/HOTP)."
onepassword = "OTP"
default_protected = true

[kind.link]
description = "A reference to another entry by UUID (a KeePass `{REF:T@I:...}` reference or the bare UUID). pdh checks that it resolves and that the target has an allowed schema; it never reads what is linked."
default_protected = false
behaviour = "link"

# --- decision log -------------------------------------------------------------------------------

[[decision]]
date = "2026-10-02"
status = "decided"
by = "user"
text = "Record types come from an explicit `_schema` and/or from field-based match rules (`[[match]]`: an entry that has all the listed fields is of that type); the types of an entry are the union of both, and a type that is named and matched counts once, as named. A rule only uses fields that belong to one record type alone, so it never guesses; look-alike types (bank-card or credit-card, a plain website) are named with `_schema`. Group globs and tags stay rejected."

[[decision]]
date = "2026-10-02"
status = "decided"
by = "user"
text = "A profile is one complete variant of a taxonomy. It is named by the taxonomy and its own name, joined: taxonomy `pdh`, profile `default`, full name `pdh-default` (file `profiles/pdh-default.toml`, `--profile pdh-default`; the `[profile]` header holds taxonomy, name, version, description). A vault follows exactly one profile; profiles are never merged or layered, so the taxonomy stays dogma inside each. This file is `pdh-default`, the opinionated one."

[[decision]]
date = "2026-10-02"
status = "decided"
by = "user"
text = "Everything the default profile documents is enforced: the former proposed terms and record types (IBAN, BIC, account_number, ICCID, PUK, IMEI, part_number, contract_no, member_no, email, address, valid_until, api_key, api_secret, client_id, client_secret, recovery_code, public_key, fingerprint; bank-account, utility-contract, hardware, hsm, identity-document, membership, software-license, api-credential) are active. A field a record type names is always a vocabulary term."

[[decision]]
date = "2026-10-02"
status = "decided"
by = "user"
text = "Terms are snake_case. Only a term that is itself an abbreviation is written in capitals (PIN, PUK, MAC); inside a compound the abbreviation is lowercase (so_pin, api_key, wifi_key)."

[[decision]]
date = "2026-10-02"
status = "decided"
by = "user"
text = "Value-format hints (`pattern`) stay, at INFO level: they never block and never judge whether a value is correct."

[[decision]]
date = "2026-10-02"
status = "decided"
by = "user"
text = "The generic schema `device` is named `hardware`, so that `device` only means the link field and the family; `wifi-access-point` and `openwrt-device` are the device schemas for access points and routers."

[[decision]]
date = "2026-10-01"
status = "decided"
by = "user"
text = "`URL` is required for online shops and websites; entries without a URL are findings, not exceptions."

[[decision]]
date = "2026-10-01"
status = "decided"
by = "user"
text = "Tags are not used to bind schemas to entries."

[[decision]]
date = "2026-10-01"
status = "decided"
by = "user"
text = "Backups are the user's job. pdh never copies or backs up the database file, and writes are dry runs unless `--apply`."

[[decision]]
date = "2026-10-02"
status = "decided"
by = "user"
text = "A website account is an entry that has a URL; the `website` schema is the base and `onlineshop` is a specialisation."

[[decision]]
date = "2026-10-02"
status = "decided"
by = "user"
text = "`Password` stays required for `website`; entries without one are findings."

[[decision]]
date = "2026-10-02"
status = "decided"
by = "user"
text = "Folders are irrelevant for usability (search is used); area sub-groups exist for browsing only."

[[decision]]
date = "2026-10-02"
status = "decided"
by = "user"
text = "The taxonomy is dogma: one public taxonomy, no private overlays. Field names outside the vocabulary are unsupported and reported as WARN; the taxonomy defines no aliases."

[[decision]]
date = "2026-10-02"
status = "decided"
by = "user"
text = "Typing is by an explicit `_schema` field, comma-separated, with several schemas allowed (union). Implicit matching rules and group globs were dropped."

[[decision]]
date = "2026-10-02"
status = "decided"
by = "user"
text = "Reusable rule bundles are called 'facets' ('sub-schema' was rejected)."

[[decision]]
date = "2026-10-02"
status = "decided"
by = "user"
text = "`phone` and `mobile` are separate vocabulary terms; 'landline' was rejected as a term."

[[decision]]
date = "2026-10-02"
status = "decided"
by = "user"
text = "1Password is the model for field types and item categories. KeePassDX has no typed fields, so they are emulated with `_schema` files."

[[decision]]
date = "2026-10-02"
status = "decided"
by = "user"
text = "No spaces in field labels."

[[decision]]
date = "2026-10-02"
status = "decided"
by = "user"
text = "No batch write command (`set-many` was rejected); the scope is the tool itself, the `linkify()` / `tel:` idea was dropped."

[[decision]]
date = "2026-10-02"
status = "decided"
by = "user"
text = "Abbreviations such as PIN are written in capitals; snake_case is not applied mechanically. The vocabulary terms `PIN`, `CVV` and `MAC` are written that way."

[[decision]]
date = "2026-10-02"
status = "decided"
by = "user"
text = "pdh does not validate whether values are correct (no Luhn or IBAN checksums, no lookups): the user alone is responsible for data quality."

[[decision]]
date = "2026-10-02"
status = "decided"
by = "user"
text = "One device, many users: the device is one entry; every additional user is its own entry with the standard login fields (KeePass clients give custom fields no autofill or auto-type), linked to the device by UUID, written as a KeePass reference. The device's main login stays in its own standard fields."

[[decision]]
date = "2026-10-02"
status = "decided"
by = "user"
text = "`credit-card` (CVV allowed, not required) and `bank-card` (no CVV) replace `payment-card`; the shared part is the facet `card-core`; a card's validity is the entry's own expiry date."

[[decision]]
date = "2026-10-02"
status = "decided"
by = "user"
text = "`http://` is a valid URI: pdh never treats it as an error; at most it is a WARN-level hint. Nothing may present it as a problem of its own invention."

[[decision]]
date = "2026-10-02"
status = "decided"
by = "user"
text = "Findings carry a level taken 1:1 from log levels: ERROR (broken structure, a `required` field missing, an unknown schema), WARN (hygiene such as `http://`, an unprotected secret, a missing `recommended` field or expiry date), INFO (format hints such as `pattern`). `validate --level` filters the display, `--fail-on` (default ERROR) decides the exit code. On the schema side the matching tiers are `required` (MUST), `recommended` (SHOULD) and `optional` (MAY)."

[[decision]]
date = "2026-10-02"
status = "open"
by = "user"
text = "Final list of kinds and families (the ones here are a first proposal)."

