# =================================================================================================
# FIELD VOCABULARY (checked on every entry)
# =================================================================================================

# Anything that looks like a secret by name must be protected: PINs, PUKs, tokens, API keys,
# passwords, recovery/2FA material, Wi-Fi keys. The regex is a safety net for non-canonical
# names until they are renamed to a term.
[field.secret]
description = "Secrets, recognised by name."
kind = "secret"
match = '(?i)pin|puk|token|secret|passw|kennwort|api[ _-]?key|recovery|2fa|wifi[ _-]?key|backupkey|keystore|reset code|unlock code'
protected = true

# Security questions come in pairs, any number of them: `security_question_1` / `security_answer_1`, `_2`, `_3`, ...
# The question is not secret; the answer is, and is protected like a password.
[field.security_question]
description = "A personal security question an account asks for; numbered when there are several."
kind = "text"
family = ["access"]
match = '^security_question(_[0-9]+)?$'
protected = false
example = "Name of your first pet?"

[field.security_answer]
description = "The answer to a security question, numbered like its question."
kind = "secret"
family = ["access"]
match = '^security_answer(_[0-9]+)?$'
protected = true
example = "example-answer"

# Private key material by field name: `ssh_key`, `private_key`, `passphrase`, `armored`, `seed`,
# `mnemonic`, ... Public keys (anything with `pub`/`public` in the name), fingerprints
# and key check values are NOT matched: they are not secret.
[field.key_material]
description = "Private key material, recognised by name."
kind = "key"
family = ["keys"]
match = '(?i)^(?!.*(?<![a-z])(pub(lic)?|fingerprint)(?![a-z])).*((?<![a-z])(ssh|rsa|ecdsa|ed25519|gpg|pgp|private|signing)(?![a-z]).*(?<![a-z])key(?![a-z])|(?<![a-z])privkey(?![a-z])|armou?red|(?<![a-z])seed(?![a-z])|mnemonic|passphrase|recovery phrase)'
protected = true

[field.PIN]
example = "0000"
description = "Numeric PIN or PUK."
kind = "secret"
family = ["telecom", "finance", "identity"]
pattern = '[0-9]{4,8}'
protected = true

[field.CVV]
example = "000"
description = "Card security code."
kind = "card"
family = ["finance"]
pattern = '[0-9]{3,4}'
protected = true

[field.card_number]
example = "0000 0000 0000 0000"
description = "Card number, digits with optional spaces."
kind = "card"
family = ["finance"]
pattern = '[0-9 ]{13,23}'
protected = true

[field.license_key]
description = "Software licence key."
kind = "secret"
family = ["keys"]
protected = true

[field.serial_number]
description = "Manufacturer serial number of a device or product."
kind = "identifier"
family = ["device"]
protected = false

[field.customer_no]
description = "Customer or account number at a company."
kind = "identifier"
family = ["access", "contract"]
protected = false

# Two distinct terms: `phone` is the ordinary (landline or general) number, `mobile` is a
# mobile number.
[field.phone]
description = "Phone number (landline or general): digits with common separators or a tel: URI."
kind = "phone"
family = ["contract", "telecom"]
pattern = '(tel:)?\+?[0-9 ()./-]{5,}'
protected = false

[field.mobile]
description = "Mobile phone number."
kind = "phone"
family = ["contract", "telecom"]
pattern = '(tel:)?\+?[0-9 ()./-]{5,}'
protected = false

[field.MAC]
example = "00:00:5E:00:53:01"
description = "Network hardware (MAC) address."
kind = "identifier"
family = ["device"]
protected = false

# One device, many users: the device is one entry; every additional user is its own entry with the standard
# login fields (so autofill, auto-type and TOTP keep working) and this link to the device. Set it with
# `pdh edit link "<account>" "<device>" --apply`.
[field.device]
description = "The device an account belongs to: a link to the device entry."
kind = "link"
family = ["device"]

# --- more terms ----------------------------------------------------------------------------------

[field.IBAN]
example = "XX00 0000 0000 0000 00"
description = "International bank account number."
kind = "identifier"
family = ["finance"]
protected = false

[field.BIC]
example = "EXAMPXXX"
description = "Bank identifier code (SWIFT)."
kind = "identifier"
family = ["finance"]
protected = false

[field.account_number]
example = "0000000000"
description = "Account number at a bank or broker."
kind = "identifier"
family = ["finance"]
protected = false

[field.ICCID]
example = "0000000000000000000"
description = "SIM card serial number (ICCID)."
kind = "identifier"
family = ["telecom"]
protected = false

[field.PUK]
example = "00000000"
description = "SIM unlock code (PUK)."
kind = "secret"
family = ["telecom"]
