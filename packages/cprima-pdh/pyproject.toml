[project]
name = "cprima-pdh"
version = "0.0.6"
description = "Practical Digital Housekeeping: check and tidy your KeePass vault against a written taxonomy."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Christian Prior-Mamulyan" }]
keywords = ["keepass", "kdbx", "password-manager", "digital-housekeeping", "pdh"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Security",
    "Topic :: Utilities",
]
dependencies = ["typer>=0.12", "pydantic>=2", "lxml"]

[project.optional-dependencies]
kdbx = ["pykeepass>=4.1"]
sops = ["cryptography>=42"]
all = ["cprima-pdh[kdbx,sops]"]

[project.scripts]
pdh = "cprima_pdh.cli:app"

[project.entry-points."pdh.backends"]
kdbx = "cprima_pdh.backends.kdbx:Backend"
sops = "cprima_pdh.backends.sops:Backend"

[project.urls]
Homepage = "https://pdh.cprima.net"
Source = "https://github.com/practical-digital-housekeeping/cprima-pdh/tree/main/packages/cprima-pdh"
Repository = "https://github.com/practical-digital-housekeeping/cprima-pdh"
Issues = "https://github.com/practical-digital-housekeeping/cprima-pdh/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# The vault layers are separate packages in this repository (../cprima-pdh-vault, -kdbxkit, -sopskit) and are bundled into this
# wheel for now: nothing else is published. A build goes sdist first, then wheel from the sdist; the sdist carries the sibling
# sources under src/. (A wheel built directly from the tree, `uv build --wheel`, would leave them out: do not release that.)
[tool.hatch.build.targets.wheel]
packages = ["src/cprima_pdh", "src/cprima_pdh_vault", "src/cprima_pdh_kdbxkit", "src/cprima_pdh_sopskit"]

[tool.hatch.build.targets.sdist.force-include]
"../cprima-pdh-vault/src/cprima_pdh_vault" = "src/cprima_pdh_vault"
"../cprima-pdh-kdbxkit/src/cprima_pdh_kdbxkit" = "src/cprima_pdh_kdbxkit"
"../cprima-pdh-sopskit/src/cprima_pdh_sopskit" = "src/cprima_pdh_sopskit"
