[project]
name = "pdh-testkit"
version = "0.0.0"
description = "Test support for cprima-pdh: synthetic and genuine KeePass vaults. Never published."
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = ["pykeepass>=4.1", "pytest>=8"]
classifiers = ["Private :: Do Not Upload"]

[project.entry-points.pytest11]
pdh_testkit = "pdh_testkit.fixtures"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pdh_testkit"]
